[project]
name = "geneval_evaluator"
version = "0.1.0"
description = "Minimal GenEval evaluator for text-to-image generation"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.2",
  "pandas>=2.3",
  "pillow>=12.0",
  "torch>=2.10",
  "tqdm>=4.67",
  "transformers>=4.57",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geneval_evaluator*"]

[tool.setuptools.package-data]
geneval_evaluator = ["*.txt", "*.json"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
